<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MT5 Web Console — control MetaTrader 5 from the browser</title>
<meta name="description" content="Web control plane for a MetaTrader 5 terminal: account login, symbols, algo deployment and live trading." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M6 22l5-9 4 5 3-6 8 10' stroke='%2337e6a4' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<div id="app" class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">M5</span>
      <div>
        <b>MT5 Web Console</b>
        <small id="brand-sub">control plane</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-action="nav" data-view="overview" href="#/overview"><i>◎</i><span>Overview</span></a>
      <a class="nav-item" data-action="nav" data-view="markets" href="#/markets"><i>▤</i><span>Markets</span></a>
      <a class="nav-item" data-action="nav" data-view="trade" href="#/trade"><i>⇄</i><span>Manual Trade</span></a>
      <a class="nav-item" data-action="nav" data-view="studio" href="#/studio"><i>∿</i><span>Algo Studio</span></a>
      <a class="nav-item" data-action="nav" data-view="positions" href="#/positions"><i>▦</i><span>Positions</span></a>
      <a class="nav-item" data-action="nav" data-view="bridge" href="#/bridge"><i>⛓</i><span>Bridge Agent</span></a>
      <a class="nav-item" data-action="nav" data-view="settings" href="#/settings"><i>⚙</i><span>Settings</span></a>
    </nav>
    <div class="side-foot">
      <div class="pill-row">
        <span class="pill" id="pill-bridge">bridge: —</span>
        <span class="pill" id="pill-account">account: —</span>
      </div>
      <label class="switch-row" title="Blocks every new order and stops all algos">
        <input type="checkbox" id="kill-switch" />
        <span class="sw"></span><span class="sw-txt">Kill switch</span>
      </label>
      <a class="ghost-link" data-action="logout" href="#">sign out</a>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="ticker" id="ticker"><em>connect a bridge agent to see live prices</em></div>
      <div class="top-actions">
        <div class="acct-card" id="acct-card">
          <div class="acct-line"><span class="muted">balance</span><b id="top-balance">—</b></div>
          <div class="acct-line"><span class="muted">equity</span><b id="top-equity">—</b></div>
          <div class="acct-line"><span class="muted">floating</span><b id="top-fl">—</b></div>
        </div>
        <button class="btn ghost" data-action="refresh">↻ refresh</button>
      </div>
    </header>
    <section id="view" class="view"></section>
    <div class="modal-root" id="modal-root"></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script src="/static/core.js"></script>
<script src="/static/views.js"></script>
<script src="/static/views2.js"></script>
<script src="/static/views3.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
